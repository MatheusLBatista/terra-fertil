# Docker Compose para DESENVOLVIMENTO — sobe o PostgreSQL de dev e o de testes.
# A API roda localmente via: npm run dev
#
# Uso (Makefile usa -p template-ia-dev para não colidir com outros projetos):
#   docker compose -p template-ia-dev --env-file .env -f docker-compose.yml up -d
# Só o banco de testes (npm run test:integration):
#   docker compose -p template-ia-dev --env-file .env -f docker-compose.yml up -d db_test
# Os dados ficam em ./data/postgres-dev e ./data/postgres-test (ignorados pelo
# git). O compose de PRODUÇÃO (docker-compose.prod.yml na raiz) usa
# ./data/postgres-prod e containers com sufixo _prod — as duas pilhas coexistem.

services:
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_DB:-db_template_ia}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco dos testes de INTEGRAÇÃO (vitest --project integration). Mesmo
  # usuário/senha do dev, banco e porta próprios; o globalSetup dos testes
  # aplica o schema, a trigger e os seeds a cada rodada (skill testes-integracao).
  db_test:
    image: postgres:17-alpine
    container_name: ${CONTAINER_DB_TEST:-db_template_ia_test}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_TEST:-db_template_test}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT_TEST:-5434}:5432"
    volumes:
      - ./data/postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_TEST:-db_template_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
