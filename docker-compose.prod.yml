# Docker Compose de PRODUÇÃO — banco + migrate + API + front, na raiz do repositório.
# Orquestrado pelo Makefile (make prod-build / prod-up / ...); as variáveis vêm
# de backend/.env (--env-file no Makefile).
#
# - Dados do PostgreSQL em backend/data/postgres-prod (bind mount, ignorado pelo
#   git) — separado do dev (backend/data/postgres-dev), e os containers levam o
#   sufixo _prod: as pilhas dev e prod coexistem na mesma máquina.
# - migrate e api compartilham UMA imagem (IMAGE_API, default template-ia-api):
#   só `api` tem `build`; `docker compose up`/`build` constrói primeiro e o
#   `migrate` reaproveita a tag (pull_policy: never = nunca tenta baixar).
# - Portas publicadas só em 127.0.0.1 (BIND_IP): quem expõe é o reverse proxy
#   (nginx/traefik). Para publicar direto na rede, BIND_IP=0.0.0.0 no .env.
# - Logs do docker com rotação (10 MB × 3 por container) em todos os serviços.
#
# Validar: docker compose --env-file backend/.env -f docker-compose.prod.yml config --quiet

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_DB:-db_template_ia}_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - ./backend/data/postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    # Limites de recursos (opcional — descomente e ajuste ao servidor):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 1g
    networks:
      - template

  # One-shot a cada subida: schema (drizzle-kit migrate; DB_SCHEMA_MODE=push
  # troca por push) + trigger + seeds, todos idempotentes. A API só inicia
  # depois que ele termina com sucesso.
  migrate:
    image: ${IMAGE_API:-template-ia-api}
    pull_policy: never
    container_name: ${CONTAINER_APP:-api_template}_prod_migrate
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      TZ: UTC
    command: ["npx", "tsx", "src/scripts/setupDb.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging
    networks:
      - template

  api:
    build: ./backend
    image: ${IMAGE_API:-template-ia-api}
    container_name: ${CONTAINER_APP:-api_template}_prod
    restart: always
    env_file: ./backend/.env
    environment:
      # Dentro da rede do compose, o banco é resolvido pelo nome do serviço
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      TZ: UTC
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-3080}:${API_PORT:-3080}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health faz select 1 no banco — detecta API de pé com banco fora
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-3080}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512m
    networks:
      - template

  front:
    build:
      context: ./frontend
      args:
        # URLs vistas PELO NAVEGADOR (não pela rede interna do compose)
        NEXT_PUBLIC_API_URL: ${FRONT_API_URL:-http://localhost:3080}
        NEXT_PUBLIC_API_URL_CLIENT: ${FRONT_API_URL:-http://localhost:3080}
        NEXT_PUBLIC_APP_URL: ${FRONT_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_GOOGLE_LOGIN: ${FRONT_GOOGLE_LOGIN:-false}
        NEXT_PUBLIC_AMBIENTE: ${FRONT_AMBIENTE:-}
        NEXT_PUBLIC_PAGE_SIZES: ${FRONT_PAGE_SIZES:-}
        NEXT_PUBLIC_SIGNUP_ENABLED: ${FRONT_SIGNUP_ENABLED:-false}
        NEXT_PUBLIC_APP_NOME: ${FRONT_APP_NOME:-Template IA}
    image: ${IMAGE_FRONT:-template-ia-front}
    container_name: ${CONTAINER_FRONT:-front_template}_prod
    restart: always
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONT_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 512m
    networks:
      - template

networks:
  template:
